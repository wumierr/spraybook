# ============================================================
#  nginx.conf — 静态站点 server 块
#
#  用法 A（容器内）: 已由 deploy/Dockerfile 复制到
#                    /etc/nginx/conf.d/default.conf，无需改动
#  用法 B（宿主机）: cp deploy/nginx.conf /etc/nginx/conf.d/drone-spray.conf
#                    然后把下面的 root 改成 dist/ 的绝对路径，
#                    再执行 nginx -t && systemctl reload nginx
# ============================================================

server {
    listen       80;
    listen       [::]:80;
    server_name  _;                       # 换成你的域名，如 calc.example.com

    root   /usr/share/nginx/html;         # 宿主机部署时改为 /var/www/drone-spray
    index  index.html;

    charset utf-8;

    # ---- gzip 压缩（HTML/CSS/JS 体积能降 70%+）----
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json image/svg+xml;

    # ---- 安全响应头 ----
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- 带指纹的静态资源：长缓存 ----
    location ~* ^/(assets)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/(css|js)/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- Service Worker 绝不能缓存，否则用户更新不到 ----
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # ---- 入口页不缓存 ----
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires -1;
    }

    # ---- 主逻辑：纯静态，找不到就 404（本项目不是 SPA 路由）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- APK 下载（可选，dist/download/ 下）----
    location /download/ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

