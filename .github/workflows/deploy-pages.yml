# ============================================================
#  GitHub Pages 自动部署
#
#  启用方法（只需点几下，之后永久自动）:
#    1. 仓库 Settings -> Pages -> Build and deployment -> Source 选 "GitHub Actions"
#    2. 推一次代码到 main 分支
#    3. 站点地址: https://<用户名>.github.io/<仓库名>/
#
#  完全免费、无需信用卡，公开仓库无限流量。
#  缺点: 国内访问速度一般（Cloudflare Pages 更快）。
# ============================================================
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # 支持在 Actions 页面手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，新的会取消排队中的旧的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建静态目录 dist/
        run: bash scripts/build-web.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
