plugins {
    id 'com.android.application'
}

// E5 配置化：版本三件套由 scripts/build-apk.ps1 从 apk.config.json + js/version.js
// 注入（-P 属性）；直接用 gradle 命令行构建时回退到下方字面量——
// 字面量必须与 js/version.js APP_VERSION 保持一致（缺省基线，R3 核对规则延续）。
def appVersionName = project.findProperty('APP_VERSION_NAME') ?: '4.13.0'
def appVersionCode = (project.findProperty('APP_VERSION_CODE') ?: '5') as Integer
def appPkgId       = project.findProperty('APP_PKG_ID') ?: 'com.dronespray.calculator'
def ksFile         = project.findProperty('APP_KEYSTORE_FILE')   // 相对 androidapp/ 或绝对路径（apk.config.json 注入）
def ksAlias        = project.findProperty('APP_KEYSTORE_ALIAS')

android {
    namespace 'com.dronespray.calculator'
    compileSdk 34

    defaultConfig {
        applicationId "$appPkgId"
        minSdk 21          // Android 5.0（覆盖 99%+ 设备）
        targetSdk 34       // Android 14
        versionCode appVersionCode
        versionName "$appVersionName"
        resConfigs "zh", "zh-rCN"  // 仅保留中文资源，减小体积
    }

    // E5：配置了 keystore（apk.config.json.signing）才启用 release 签名；
    // 密码只走环境变量 SPRAYBOOK_KEYSTORE_PASS / SPRAYBOOK_KEY_PASS，永不入库。
    signingConfigs {
        if (ksFile && file(ksFile).exists()) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('SPRAYBOOK_KEYSTORE_PASS') ?: ''
                keyAlias "$ksAlias"
                keyPassword System.getenv('SPRAYBOOK_KEY_PASS') ?: System.getenv('SPRAYBOOK_KEYSTORE_PASS') ?: ''
            }
        }
    }

    buildTypes {
        release {
            // 关闭混淆（WebView 应用通常无需混淆，且易踩坑）
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile && file(ksFile).exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 打包时排除冗余文件
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt'
            ]
        }
    }
}

dependencies {
    // Kotlin BOM：对齐所有 kotlin-stdlib* 版本。
    // 不加会构建失败——androidx annotation 拉 kotlin-stdlib:1.8.22，而 androidx lifecycle
    // 经 kotlinx-coroutines:1.6.4 拉 kotlin-stdlib-jdk8:1.6.21；Kotlin 1.8 起 jdk7/jdk8
    // 的类已合并进主 stdlib，两者同时存在会报 "Duplicate class kotlin.*"。
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
