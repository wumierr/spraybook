plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dronespray.calculator'
    compileSdk 34

    defaultConfig {
        applicationId "com.dronespray.calculator"
        minSdk 21          // Android 5.0（覆盖 99%+ 设备）
        targetSdk 34       // Android 14
        versionCode 5
        versionName "4.8.0"  // 与 js/version.js APP_VERSION 手动同步（无预处理，R3 核对）
        resConfigs "zh", "zh-rCN"  // 仅保留中文资源，减小体积
    }

    buildTypes {
        release {
            // 关闭混淆（WebView 应用通常无需混淆，且易踩坑）
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 打包时排除冗余文件
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt'
            ]
        }
    }
}

dependencies {
    // Kotlin BOM：对齐所有 kotlin-stdlib* 版本。
    // 不加会构建失败——androidx annotation 拉 kotlin-stdlib:1.8.22，而 androidx lifecycle
    // 经 kotlinx-coroutines:1.6.4 拉 kotlin-stdlib-jdk8:1.6.21；Kotlin 1.8 起 jdk7/jdk8
    // 的类已合并进主 stdlib，两者同时存在会报 "Duplicate class kotlin.*"。
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
